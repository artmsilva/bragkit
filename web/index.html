<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>bragkit · achievements</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    /* Baseline CSS only: nesting is Widely Available, but kept flat for clarity. */
    body { padding-bottom: 4rem; }
    .stat-num { font-size: 2rem; font-weight: 700; line-height: 1; }
    .ach-list { max-height: 70vh; overflow: auto; }
    .ach-row { border-left: 3px solid var(--bs-border-color); }
    .ach-row:hover { border-left-color: var(--bs-primary); background: var(--bs-tertiary-bg); }
    .mono { font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <nav class="navbar bg-body-tertiary border-bottom mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1"><i class="bi bi-trophy-fill text-warning"></i> bragkit</span>
      <button id="theme" class="btn btn-sm btn-outline-secondary" type="button" title="Toggle theme">
        <i class="bi bi-circle-half"></i>
      </button>
    </div>
  </nav>

  <main class="container">
    <div id="stats" class="row g-3 mb-4"></div>

    <div id="trend" class="card mb-4 d-none">
      <div class="card-header d-flex align-items-center gap-2">
        <i class="bi bi-bar-chart-line text-info"></i> Activity by month
      </div>
      <div class="card-body"><div id="trend-bars" class="d-flex align-items-end gap-1" style="height: 90px;"></div></div>
    </div>

    <div id="top-impact" class="card mb-4 d-none">
      <div class="card-header d-flex align-items-center gap-2">
        <i class="bi bi-graph-up-arrow text-success"></i> Top achievements by impact
      </div>
      <ol id="top-impact-list" class="list-group list-group-numbered list-group-flush"></ol>
    </div>

    <div class="card mb-4">
      <div class="card-header d-flex justify-content-between align-items-center gap-2 flex-wrap">
        <span><i class="bi bi-file-earmark-text text-primary"></i> Report</span>
        <select id="report-template" class="form-select form-select-sm w-auto" aria-label="Report template"></select>
      </div>
      <div class="card-body p-0">
        <pre id="report-output" class="mono small m-0 p-3" style="max-height: 460px; overflow: auto;"></pre>
      </div>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-sm">
        <input id="search" class="form-control" type="search" placeholder="Search achievements…" autocomplete="off" />
      </div>
      <div class="col-sm-auto"><select id="source" class="form-select"><option value="">All sources</option></select></div>
      <div class="col-sm-auto"><select id="type" class="form-select"><option value="">All types</option></select></div>
    </div>

    <div id="empty" class="alert alert-secondary d-none">No achievements match.</div>
    <div id="list" class="list-group ach-list"></div>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
